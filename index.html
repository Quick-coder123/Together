<!doctype html>
<html lang="uk" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
  <title>Хамелеончики</title>
  <meta name="description" content="Затишний куточок для двох">
  <meta name="theme-color" content="#14100E">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icons/icon.svg?v=2" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png?v=2">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Хамелеончики">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <div id="app"></div>
  <div id="toast" role="status" aria-live="polite"></div>
  <script>try{var t=localStorage.getItem('os.theme');t=t?JSON.parse(t):'dark';if(t==='light'||(t==='auto'&&!matchMedia('(prefers-color-scheme: dark)').matches))document.documentElement.dataset.theme='light'}catch(e){}</script>
  <script type="module" src="/js/app.js"></script>
</body>
</html>
